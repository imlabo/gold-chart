name: market data

on:
  schedule:
    - cron: "7 */3 * * *"      # 3時間ごとに起動（遅れても前のジョブが5時間50分動き続ける）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true     # 新しいジョブが始まったら古いループは止める（常に1本だけ動く）

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every 5 minutes and publish to data branch
        run: bash scripts/loop.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
